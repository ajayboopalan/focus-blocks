[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "focusblocks"
version = "0.4.0"
description = "Automatic focus-block tracker for Windows: counts work time, prompts breaks, draws a yearly heatmap."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ajay Boopalan" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["focus", "pomodoro", "productivity", "time-tracking", "windows", "study"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Environment :: Win32 (MS Windows)",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "psutil>=5.9",
    "pillow>=10.0",
    "pyvda>=0.4; sys_platform == 'win32'",
    "winotify>=1.1; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/ajayboopalan/focus-blocks"
Issues = "https://github.com/ajayboopalan/focus-blocks/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.17.3",   # same version as .pre-commit-config.yaml, so the hook and CI agree
    "mypy>=1.10",
    "pre-commit>=3.7",
]
build = [
    "pyinstaller>=6.10",   # packaging/build.ps1: FocusBlocks.exe, then the Inno Setup installer
]

[project.scripts]
focusblocks = "focusblocks.cli:main"

[project.gui-scripts]
# Same entry point without a console window (like running with pythonw).
focusblocksw = "focusblocks.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------- tooling
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["focusblocks"]
omit = ["src/focusblocks/ui/*", "src/focusblocks/platform/windows/*"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["legacy"]   # original single-file version, kept for reference

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E731",    # lambdas are used deliberately for short Tk callbacks
    "SIM105",  # explicit try/except/pass reads clearer for best-effort OS calls
    "RUF001",  # UI copy may contain typographic characters
]

[tool.ruff.lint.isort]
known-local-folder = ["fakes"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
platform = "win32"
files = ["src", "tests"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["focusblocks.core.*", "focusblocks.config.*", "focusblocks.storage.*", "focusblocks.reports.*"]
disallow_untyped_defs = true
